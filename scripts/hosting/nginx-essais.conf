# Sites d'essai GeniusPress : {essai}.78-24-248-103.sslip.io (VPS 78.24.248.103).
# Un certificat par essai, obtenu par scripts/hosting/certificats-essais.sh.
#
# Installation (en root) :
#   cp scripts/hosting/nginx-essais.conf /etc/nginx/sites-available/geniuspress-essais
#   ln -s /etc/nginx/sites-available/geniuspress-essais /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Le bloc existant de la plateforme (vps127199.serveur-vps.net) ne change pas.
# Avec un vrai domaine et un certificat générique : remplacer le domaine et mettre
# le chemin du certificat générique à la place de $gp_cert.

# Identifiant du site d'après l'adresse (sert aux médias).
map $host $gp_site {
    default "";
    "~^(?<s>[a-z0-9-]+)\.78-24-248-103\.sslip\.io$" $s;
}

# Certificat d'après le nom demandé (SNI), limité aux adresses d'essai.
map $ssl_server_name $gp_cert {
    default "geniuspress-essai-inconnu";
    "~^(?<h>[a-z0-9-]+\.78-24-248-103\.sslip\.io)$" $h;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.78-24-248-103.sslip.io;

    # Défi Let's Encrypt (HTTP-01) : fichiers déposés par certbot dans public/.well-known.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geniuspress/public;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.78-24-248-103.sslip.io;

    # Certificat chargé à chaque connexion d'après l'adresse (Nginx ≥ 1.15.9).
    ssl_certificate     /etc/letsencrypt/live/$gp_cert/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$gp_cert/privkey.pem;

    root /var/www/geniuspress/public;
    index index.php;
    client_max_body_size 20m;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Médias de chaque essai, servis sans PHP depuis son propre dossier.
    location ~ ^/storage/(?<gp_path>.+)$ {
        alias /var/www/geniuspress/storage/hosting/sites/$gp_site/storage/app/public/$gp_path;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120;
    }

    # Aucun autre fichier PHP ni fichier caché.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
